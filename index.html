<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hulas Group AI Assistant</title>
<link rel="icon" type="image/png" href="image2.png">

<!-- Font Awesome for social icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
/* Reset & base */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;
    background:var(--bg);
    color:var(--text);
    transition:background .25s,color .25s;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;text-size-adjust:100%;
}

/* Fluid typography for all text except welcome section */
html { font-size: clamp(14px, 1.8vw, 17px); }

:root{
    --bg:#ffffff;
    --text:#0d0d0d;
    --border:#e5e5e5;
    --card:#f8f8f8;
    --input-bg:#ffffff;
    --btn-bg:#0d0d0d;
    --btn-text:#ffffff;
    --header-height:84px;
    --gutter:1rem;
}

.dark{
    --bg:#0d0d0d;
    --text:#ececec;
    --border:#2d2d2d;
    --card:#1a1a1a;
    --input-bg:#2d2d2d;
    --btn-bg:#ececec;
    --btn-text:#0d0d0d;
}

/* Header */
header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(var(--gutter) * 1.25) calc(var(--gutter) * 2);
    border-bottom:1px solid var(--border);
    background:var(--bg);
    gap:1rem;position:sticky;top:0;z-index:20;
}
.logo-container{display:flex;align-items:center;gap:1rem;min-width:0}
.logo{height:96px;width:auto;transition:opacity .3s,max-height .3s;display:block}
.logo-text{font-size:1.25rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:.6rem;align-items:center}
button{cursor:pointer;border:none;border-radius:10px;padding:.55rem .9rem;font-weight:600;transition:transform .12s ease,opacity .12s ease}
button:active{transform:translateY(1px)}

/* Updated New Chat Button */
.new-chat {
    background: var(--btn-text);
    color: var(--btn-bg);
    border: 1px solid var(--border);
    padding: .65rem 1rem;
    border-radius: 10px;
    font-size: 1rem;
    font-family: monospace;
    font-weight: 500;
    height: 48px;
    transition: background .25s, color .25s, opacity .25s;
}
.new-chat:hover {
    background: var(--btn-bg);
    color: var(--btn-text);
    opacity: 1;
}

/* Theme toggle */
.theme-toggle{
    position:relative;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 6px 18px rgba(0,0,0,0.04)
}
.theme-toggle .icon{position:absolute;transition:opacity .25s,transform .3s}
.theme-toggle .moon{opacity:1;transform:rotate(0deg)}
.theme-toggle .sun{opacity:0;transform:rotate(90deg)}
.dark .theme-toggle .moon{opacity:0;transform:rotate(-90deg)}
.dark .theme-toggle .sun{opacity:1;transform:rotate(0deg)}

/* Main content */
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2.25rem var(--gutter);}
.welcome{transition:opacity .5s ease,visibility .5s ease;max-width:900px}
.welcome.hide{opacity:0;visibility:hidden;height:0;padding:0;margin:0}
.welcome h1{font-size:2.4rem;margin-bottom:.6rem}
.welcome p{color:var(--text);font-size:1.05rem;max-width:700px;line-height:1.6;margin:0 auto .9rem}
.welcome img{margin-top:1rem;width:240px;height:auto;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
.welcome a{color:#1a73e8;text-decoration:none;margin:0 .25rem;}
.welcome a:hover{text-decoration:underline;}

/* Social icons with name */
.social-icons{display:flex;gap:0.5rem;align-items:center;justify-content:center;margin-top:0.25rem;}
.social-icons a{font-size:1.25rem;color:#1a73e8;transition:color .25s; display:flex; align-items:center; gap:0.25rem;}
.social-icons a:hover{color:#0a58ca;}

/* Response text */
.response {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin: 1rem auto;
    max-width: 900px;
    text-align: left;
    white-space: pre-wrap;
}

/* Footer / Input area */
footer{border-top:1px solid var(--border);background:var(--bg);padding:1rem var(--gutter)}
.input-area{max-width:1100px;margin:0 auto;position:relative;display:flex;align-items:center;gap:.6rem;padding:0 .25rem}
textarea{
    flex:1;
    padding:1rem 3.75rem 1rem 1rem;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--input-bg);
    color:var(--text);
    resize:none;
    font-size:1rem;
    height:64px;
    transition:box-shadow .15s;
    line-height:1.5;
}
textarea:focus{outline:none;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
.send{position:absolute;right:.5rem;background:var(--btn-bg);color:var(--btn-text);border:none;width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.send:hover{opacity:.95}
.hint{margin-top:.6rem;font-size:0.82rem;color:gray;text-align:center}

/* Secondary logos */
.light-logo{display:block}
.dark-logo{display:none}
.light-logo2{display:block}
.dark-logo2{display:none}
.dark .light-logo{display:none}
.dark .dark-logo{display:block}
.dark .light-logo2{display:none}
.dark .dark-logo2{display:block}

/* Responsive typography adjustments */
@media (max-width:900px){
    .logo{height:84px}
    .welcome img{width:200px}
    .response{font-size:0.97rem}
    textarea{font-size:0.97rem}
}
@media (max-width:700px){
    html { font-size: clamp(13px, 2.5vw, 15px); }
    header{padding:0.6rem 0.9rem}
    .logo{height:72px}
    .logo-text{font-size:1rem}
    .logo-container{gap:.75rem}
    .actions{gap:.5rem}
    .new-chat{padding:.55rem .9rem;font-size:.95rem;height:44px}
    .welcome img{width:170px}
    textarea{height:72px;font-size:0.96rem}
    .response{font-size:0.95rem}
    .send{width:44px;height:44px;right:.45rem}
}
@media (max-width:520px){
    html { font-size: clamp(12.5px, 3vw, 14.5px); }
    header{align-items:center}
    .logo{height:60px}
    .logo-container{gap:.6rem}
    .logo-text{font-size:0.95rem}
    .actions{gap:.4rem}
    .theme-toggle{width:40px;height:40px}
    .new-chat{padding:.5rem .75rem;font-size:.9rem;height:42px}
    main{padding:1.2rem}
    .welcome img{width:140px}
    .input-area{padding:0;width:100%}
    textarea{height:72px;padding:0.85rem 3.6rem 0.85rem 0.9rem;font-size:0.95rem}
    .response{font-size:0.94rem}
    .send{right:.45rem}
}
@media (max-width:400px){
    html { font-size: clamp(12px, 3.5vw, 14px); }
    .logo{height:52px}
    .logo-text{display:none}
    .welcome img{width:120px}
    textarea{height:80px;font-size:0.94rem;padding:0.8rem 3.6rem 0.8rem 0.8rem}
    .response{font-size:0.93rem}
    .send{width:42px;height:42px}
}

/* Accessibility helpers */
button:focus, .theme-toggle:focus, .send:focus, .new-chat:focus{outline:3px solid rgba(0,120,210,0.12);outline-offset:2px}
</style>
</head>
<body class="dark">
<header>
  <div class="logo-container">
    <img src="1black.png" class="logo light-logo" alt="Hulas Group Logo">
    <img src="1white.png" class="logo dark-logo" alt="Hulas Group Logo">
    <img src="2black.png" class="logo light-logo2" alt="Hulas Group Logo 2">
    <img src="2white.png" class="logo dark-logo2" alt="Hulas Group Logo 2">
    <span class="logo-text">Hulas AI Assistant</span>
  </div>
  <div class="actions">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <span class="icon moon">🌙</span>
      <span class="icon sun">☀️</span>
    </button>
    <button class="new-chat" onclick="window.location.reload();">+ New Chat</button>
  </div>
</header>

<main>
  <div class="welcome" id="welcome">
    <h1>Welcome to Hulas AI Assistant</h1>
    <p>
      Your intelligent companion for business insights, automation, and productivity.<br>
      Ask your query directly.
    </p>
    <p>
      <strong>Developed by:</strong> 
      <span class="social-icons">
        <a href="https://www.linkedin.com/in/sarthak-aganja-899026166/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <i class="fab fa-linkedin"></i> Sarthak Aganja
        </a>
        <a href="https://www.facebook.com/sarthak.er" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
      </span>
    </p>
    <img src="image2.png" alt="Hulas Assistant Illustration">
  </div>
</main>

<footer>
  <div class="input-area">
    <textarea id="userInput" placeholder="Message Hulas AI Assistant..." aria-label="Message input"></textarea>
    <button class="send" id="sendBtn" aria-label="Send message">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
  <div class="hint">Powered by Hulas Group AI ( sarthak.aganja@hulasinfra.com )</div>
</footer>

<script>
const themeBtn=document.getElementById('themeToggle');
const body=document.body;
const welcome=document.getElementById('welcome');
const sendBtn=document.getElementById('sendBtn');
const userInput=document.getElementById('userInput');

// Apply saved theme
if(localStorage.getItem('theme')==='light'){
  body.classList.remove('dark');
}

// Toggle theme
themeBtn.addEventListener('click',()=>{
  body.classList.toggle('dark');
  const darkMode=body.classList.contains('dark');
  localStorage.setItem('theme',darkMode?'dark':'light');
});

// Hide welcome section after first message
let firstMessageSent=false;
sendBtn.addEventListener('click',()=>{
  const msg=userInput.value.trim();
  if(msg && !firstMessageSent){
    welcome.classList.add('hide');
    firstMessageSent=true;
  }
  // Add your AI send message logic here
});

// Enter = send, Shift+Enter = newline
userInput.addEventListener('keydown',(e)=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendBtn.click();
  }
});
</script>
<script type="module" src="ai.js"></script>
</body>
</html>
